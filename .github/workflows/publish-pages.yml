name: Publish visitor portal
on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [notices-updated]
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare public files
        run: |
          mkdir _site
          git archive HEAD -- ':(top,glob)*.html' assets css js | tar -x -C _site
          node scripts/sync-public-notices.mjs _site/public-notices.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Wait for Pages artifact to be indexed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..12}; do
            count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=github-pages" --jq '.total_count') || count=0
            if [ "$count" -gt 0 ]; then exit 0; fi
            sleep 5
          done
          echo "::error::GitHub did not index the Pages artifact within 60 seconds."
          exit 1
      - id: deployment
        uses: actions/deploy-pages@v4
