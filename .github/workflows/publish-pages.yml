name: Publish visitor portal
on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [notices-updated]
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare public files
        run: |
          mkdir _site
          git archive HEAD -- ':(top,glob)*.html' assets css js | tar -x -C _site
          node scripts/sync-public-notices.mjs _site/public-notices.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
