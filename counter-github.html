<style>
#bc-counter-samples .premium-grid button {
  position: relative;
  background: #e8f5fc;
  border: 1px solid transparent;
  color: #102749;
}
#bc-counter-samples .premium-grid button[aria-pressed="true"] {
  background: #e8f5fc;
  border-color: #1149d4;
  box-shadow: inset 0 0 0 1px #1149d4;
  color: #102749;
}
#bc-counter-samples .premium-grid button[aria-pressed="true"]::after {
  content: "✓" / "";
  position: absolute;
  top: 3px;
  right: 4px;
  width: 15px;
  border-radius: 50%;
  background: #1149d4;
  color: white;
  font-size: 10px;
  line-height: 15px;
  text-align: center;
}
#bc-counter-samples .premium-grid button .premium-icon,
#bc-counter-samples .premium-grid button[aria-pressed="true"] .premium-icon { background-color: transparent; }
#bc-counter-samples .premium-icon svg {
  width: 24px;
  height: 24px;
  fill: none;
  stroke: #1149d4;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

#bc-counter-samples .premium-grid {
  width: 100%;
  margin-inline: auto;
}
#bc-counter-samples .premium-grid button {
  aspect-ratio: 1 / 1;
  min-height: 0;
  min-width: 0;
  align-content: center;
  overflow-wrap: anywhere;
}
#bc-counter-samples .premium-grid button {
  grid-template-rows: minmax(0, 1fr) auto;
  padding: 9px 4px 7px;
}
#bc-counter-samples .premium-grid .premium-icon {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 2px;
  width: 100%;
  height: 100%;
  min-height: 0;
}
#bc-counter-samples .premium-icon img {
  width: clamp(24px, 9vw, 38px);
  height: auto;
  filter: invert(20%) sepia(91%) saturate(3920%) hue-rotate(221deg);
}
#bc-counter-samples .premium-icon img:not(:only-child) {
  width: clamp(17px, 6.5vw, 26px);
}
#bc-counter-samples .premium-grid button .premium-icon {
  width: 60px;
  height: 60px;
  align-self: center;
  background: url('assets/counter-color-icons.png') var(--icon-x) var(--icon-y) / 213.33px no-repeat;
}
#bc-counter-samples .premium-grid button { font-size: 13px; }
#bc-counter-samples .premium-grid button .utility-icon {
  background: url('assets/counter-utility.png') center / 70px no-repeat;
}
</style>

(()=>{const root=document.getElementById('bc-counter-samples');const cats=[['ride','E-hailing / Teksi','car-taxi-front','E-hailing'],['delivery','Penghantaran makanan / barang','package','Penghantaran'],['resident','Penghuni tanpa kad akses','house','Penghuni'],['office','Pejabat & Urusan Rasmi','building-2','Pejabat / Rasmi'],['visitor','Pelawat tanpa prapendaftaran','users','Pelawat'],['service','Utiliti','wrench','Utiliti'],['sales','Jualan / Promosi','megaphone','Jualan'],['other','Lain-lain','ellipsis','Lain-lain']];const defaultCategory=['delivery'];const selectField=(name,options)=>{const label=document.createElement('label');label.append(document.createTextNode(name));const select=document.createElement('select');select.name=name;options.forEach(text=>{const o=document.createElement('option');o.textContent=text;select.append(o);});label.append(select);return label;};const textField=(name,value,required=true,type='text')=>{const label=document.createElement('label');label.append(document.createTextNode(name+(required?'':' (pilihan)')));const input=document.createElement('input');Object.assign(input,{name,value,required,type});label.append(input);return label;};root.querySelectorAll('.ce').forEach((stage,index)=>{const q=s=>stage.querySelector(s);let category=defaultCategory[index],mode=index===2?'guard':'self',selectedButton;const form=q('[data-form]'),fields=q('[data-fields]');const catName=()=>cats.find(c=>c[0]===category)[1];const renderFields=()=>{fields.replaceChildren();if(category==='delivery'){fields.append(selectField('Jenis penghantaran',['Makanan','Bungkusan / Barang']),textField('Unit dituju',''));}else if(category==='ride'){fields.append(selectField('Tujuan',['Ambil penumpang','Hantar penumpang']),textField('Nama pemandu',''),selectField('Perkhidmatan',['Grab','Teksi','Lain-lain']),selectField('Lokasi menunggu',['Lobi Blok A']));}else if(category==='resident'){fields.append(textField('Nama penghuni',''),textField('Unit rumah',''),textField('Nombor telefon','',true,'tel'),selectField('Sebab tiada kad',['Kad tertinggal','Kad hilang','Kad rosak','Belum menerima kad']));}else{fields.append(textField('Nama',''),textField('Nombor telefon','',true,'tel'));if(['delivery','visitor'].includes(category))fields.append(textField('Unit dituju',''));if(category==='sales')fields.append(selectField('Destinasi',['Pejabat Pengurusan']));if (category === 'office') { fields.append(selectField('Jenis urusan', ['Pejabat Pengurusan']), selectField('Lokasi dituju', ['Pejabat Pengurusan'])); } else if (category === 'other') { fields.append(textField('Lokasi dituju', '')); }if(['delivery','office','sales'].includes(category))fields.append(textField('Syarikat / Organisasi','',false));if(category==='delivery')fields.append(selectField('Jenis penghantaran',['Makanan','Bungkusan / Barang','Lain-lain']));if(['office','service','official','sales','other'].includes(category))fields.append(textField('Tujuan',''));}function makeUnitPicker(unitName) {

const plate=textField('Nombor kenderaan','');fields.append(plate);const walk=document.createElement('label');walk.className='ce-inline';const check=document.createElement('input');check.type='checkbox';check.name='Tanpa kenderaan';check.value='Ya';walk.append(check,document.createTextNode('Tiada kenderaan / Berjalan kaki'));check.onchange=()=>{const input=plate.querySelector('input');input.disabled=check.checked;input.required=!check.checked;plate.hidden=check.checked;};if(category!=='ride')fields.append(walk);if(q('[data-chosen]'))q('[data-chosen]').textContent=catName();};const dropdown=q('[data-category]');if(dropdown){cats.forEach(c=>{const o=document.createElement('option');o.value=c[0];o.textContent=c[1];dropdown.append(o);});dropdown.value=category;dropdown.onchange=()=>{category=dropdown.value;renderFields();};}if(q('[data-choices]')){cats.forEach(c=>{const b=document.createElement('button');b.type='button';b.className='cursor-interaction';b.setAttribute('aria-label',c[1]);b.setAttribute('aria-pressed',String(c[0]===category));const icon=document.createElement('i');icon.dataset.lucide=c[2];icon.setAttribute('aria-hidden','true');const text=document.createElement('span');text.textContent=c[3];b.append(icon,text);b.onclick=()=>{category=c[0];q('[data-choices]').querySelectorAll('button').forEach(other=>other.setAttribute('aria-pressed',String(other===b)));};q('[data-choices]').append(b);});q('[data-next]').onclick=()=>{renderFields();q('[data-step-one]').hidden=true;form.hidden=false;q('[data-progress]').textContent='Langkah 2 daripada 2 · Butiran';};q('[data-back]').onclick=()=>{q('[data-step-one]').hidden=false;form.hidden=true;q('[data-progress]').textContent='Langkah 1 daripada 2 · Pilih kategori';};}stage.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;stage.querySelectorAll('[data-mode]').forEach(other=>other.setAttribute('aria-pressed',String(other===b)));q('[data-source]').textContent=mode==='guard'?'Direkodkan oleh Pengawal Demo. Tidak perlu hantar WhatsApp.':'Masa pendaftaran direkodkan secara automatik.';});renderFields();form.onsubmit=e=>{e.preventDefault();const submitted = new FormData(form);const data=Object.fromEntries(submitted);const units=submitted.getAll('Unit dituju');if(units.length) data['Unit dituju']=units.join(', ');const output=q('[data-success]');output.replaceChildren();const title=document.createElement('h3');title.textContent='Pendaftaran direkodkan';const demo=document.createElement('p');demo.className='ce-muted';demo.textContent='Simulasi sahaja · Tiada data dihantar';const receipt=document.createElement('div');receipt.className='ce-receipt';receipt.textContent='Kategori: '+catName()+'\n'+Object.entries(data).filter(([k])=>k!=='Kategori').map(([k,v])=>k+': '+v).join('\n')+'\nSumber: '+(mode==='guard'?'Pengawal Demo':'Isi sendiri');output.append(title,demo,receipt);if(mode==='self'){const wa=document.createElement('button');wa.type='button';wa.className='ce-primary ce-full cursor-interaction';wa.textContent='Hantar kepada Keselamatan';const message=document.createElement('div');message.className='ce-note';message.hidden=true;wa.onclick=()=>{message.hidden=false;message.textContent='Pratonton mesej WhatsApp — belum dihantar.\n'+receipt.textContent;message.style.whiteSpace='pre-line';};output.append(wa,message);}else if(q('[data-today]')){const row=document.createElement('div');row.className='ce-row';const title=document.createElement('strong');title.textContent='Baharu · '+(data.Nama||data['Nama pemandu']||data['Nama penghuni']);const detail=document.createElement('span');detail.textContent=catName()+' · '+(data['Unit dituju']||data['Unit rumah']||data['Lokasi dituju']||'');row.append(title,detail);q('[data-today]').prepend(row);}const again=document.createElement('button');again.type='button';again.className='ce-full cursor-interaction';again.style.marginTop='12px';again.textContent=mode==='guard'?'Daftar Orang Seterusnya':'Kembali ke Borang';again.onclick=()=>{output.hidden=true;q('[data-main]').hidden=false;if(mode==='guard'){renderFields();}};output.append(again);q('[data-main]').hidden=true;output.hidden=false;};if(globalThis.Tweak){const settings={radius:20};const shell=q('.ce-shell');const tweak=new Tweak({container:shell,onChange:()=>shell.style.borderRadius=settings.radius+'px'});tweak.addSlider(settings,'radius',{label:'Bucu borang',min:4,max:24,unit:'px'});}});const form = root.querySelector('[data-form]');

  icon.style.setProperty('--icon-x', (-13.64 - (spriteIndex % 3) * 60) + 'px');

<script>
const counterForm = document.querySelector('[data-form]');
const status = document.createElement('p');
status.setAttribute('role', 'status');
const submitButton = counterForm.querySelector('[data-error]').previousElementSibling;
submitButton.after(status);

document.querySelectorAll('[data-mode="guard"]').forEach(button => { button.hidden = true; });
const endpoint = 'https://script.google.com/macros/s/AKfycbznfyDGFQtyfP1KTvmNp9KP3hVKt355ka83FoHBojH4CwagrDmKaQawZym8n2aaaVdKwQ/exec';
const responseFrame = document.createElement('iframe');
responseFrame.name = 'counter-response';
responseFrame.title = 'Pengesahan pendaftaran';
responseFrame.hidden = true;
document.body.append(responseFrame);
let pending;
let saving = false;
counterForm.addEventListener('submit', event => {
  event.preventDefault();
  event.stopImmediatePropagation();
  if (saving) return;
  const formData = new FormData(counterForm);
  const fields = Object.fromEntries(formData);
  const units = formData.getAll('Unit dituju');
  if (units.length) fields['Unit dituju'] = units.join(', ');
  const category = fields.Kategori;
  delete fields.Kategori;
  const signature = JSON.stringify([category, fields]);
  if (pending?.signature !== signature) {
    pending = { signature, entry: { id: crypto.randomUUID(), category, details: fields } };
  }
  saving = true;
  status.textContent = 'Menyimpan pendaftaran…';
  const timeout = setTimeout(() => finish(), 25000);
  function finish(result) {
    clearTimeout(timeout);
    window.removeEventListener('message', receive);
    saving = false;
    status.textContent = result?.ok
      ? 'Pendaftaran berjaya. ID pendaftaran ' + result.id
      : 'Simpanan belum disahkan. Tekan Daftar Masuk sekali lagi untuk mencuba semula.';
    status.scrollIntoView({ block: 'nearest' });
  }
  const requestId = crypto.randomUUID();
  function receive(event) {
    if (!/^https:\/\/(?:[a-z0-9-]+\.)?googleusercontent\.com$/.test(event.origin)) return;
    const reply = event.data;
    if (reply?.type !== 'counter-save' || reply.requestId !== requestId ||
        reply.id !== pending.entry.id) return;
    finish(reply);
  }
  window.addEventListener('message', receive);
  const post = document.createElement('form');
  post.method = 'POST';
  post.action = endpoint;
  post.target = 'counter-response';
  const payload = document.createElement('input');
  payload.type = 'hidden';
  payload.name = 'payload';
  payload.value = JSON.stringify({ requestId, entry: pending.entry });
  post.append(payload);
  document.body.append(post);
  post.submit();
  post.remove();
}, true);
</script>
